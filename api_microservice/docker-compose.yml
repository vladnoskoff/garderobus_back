version: "3.9"

services:
  gateway:
    build: ./gateway
    env_file: ./gateway/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - auth_service
      - wardrobe_service
      - weather_service
      - ai_service
    environment:
      AUTH_SERVICE_URL: http://auth_service:8001
      WARDROBE_SERVICE_URL: http://wardrobe_service:8002
      WEATHER_SERVICE_URL: http://weather_service:8003
      AI_SERVICE_URL: http://ai_service:8004

  auth_service:
    build: ./auth_service
    env_file: ./auth_service/.env.example
    ports:
      - "8001:8000"
    depends_on:
      - postgres

  wardrobe_service:
    build: ./wardrobe_service
    env_file: ./wardrobe_service/.env.example
    ports:
      - "8002:8000"
    depends_on:
      - postgres
      - minio

  weather_service:
    build: ./weather_service
    env_file: ./weather_service/.env.example
    ports:
      - "8003:8000"

  ai_service:
    build: ./ai_service
    env_file: ./ai_service/.env.example
    ports:
      - "8004:8000"
    depends_on:
      - rabbitmq
      - postgres

  ai_worker:
    build: ./ai_service
    command: celery -A app.worker.app worker -l info
    env_file: ./ai_service/.env.example
    depends_on:
      - rabbitmq
      - postgres

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: garderobus
      POSTGRES_PASSWORD: garderobus
      POSTGRES_DB: garderobus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
