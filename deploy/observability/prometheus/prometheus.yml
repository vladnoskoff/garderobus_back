global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: garderobus-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113
    scrape_interval: 30s
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
