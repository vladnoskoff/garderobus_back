events {}

http {
    resolver 127.0.0.11 ipv6=off;

    upstream garderobus_api {
        least_conn;
        server api:8000 resolve;
    }

    upstream garderobus_admin_api {
        least_conn;
        server admin:8100 resolve;
    }

    server {
        listen 80;
        server_name _;

        # ---------- ADMINPANEL (PHP в /home/garderobus/garderobus_back/web) ----------
        # Любой запрос /adminpanel/... -> пробуем файл/папку, если нет — в index.php
        location /adminpanel/ {
            alias /home/garderobus/garderobus_back/web/;
            index index.php index.html;
            try_files $uri $uri/ /adminpanel/index.php?$query_string;
        }

        # Обработка PHP-файлов в adminpanel
        location ~ ^/adminpanel/(.+\.php)$ {
            alias /home/garderobus/garderobus_back/web/$1;

            # Путь к php-fpm — смотри что есть в /run/php/
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;

            include fastcgi_params;
            # ЯВНО указываем реальный файл
            fastcgi_param SCRIPT_FILENAME /home/garderobus/garderobus_back/web/$1;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        # ---------- статика картинок от API ----------
        location /clothes_images/ {
            alias /var/www/garderobus/clothes_images/;
        }

        location /mannequins/ {
            alias /var/www/garderobus/mannequins/;
        }

        location / {
            proxy_pass http://garderobus_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Отдельный upstream для админского API (FastAPI api_admin.main)
        # Админка остаётся изолированной по порту/контейнеру и не смешивается с публичным API.
        location /admin/ {
            proxy_pass http://garderobus_admin_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status": "ok"}';
        }

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
