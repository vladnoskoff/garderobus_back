events {}

http {
    resolver 127.0.0.11 ipv6=off;

    upstream garderobus_api {
        least_conn;
        server api:8000 resolve;
    }

    upstream garderobus_admin_api {
        least_conn;
        server admin:8100 resolve;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://garderobus_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Отдельный upstream для админского API (FastAPI admin_main.py)
        # Админка остаётся изолированной по порту/контейнеру и не смешивается с публичным API.
        location /admin/ {
            proxy_pass http://garderobus_admin_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status": "ok"}';
        }

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
