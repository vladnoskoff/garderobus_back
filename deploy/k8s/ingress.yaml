apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garderobus-api
  namespace: garderobus
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: nginx
  rules:
    - host: garderobus-api.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garderobus-api
                port:
                  number: 80
