version: "3.9"

services:
  db:
    image: postgres:14
    container_name: garderobus-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_closet}
      POSTGRES_USER: ${POSTGRES_USER:-garderobus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garderobus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - garderobus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garderobus} -d ${POSTGRES_DB:-smart_closet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    networks:
      - garderobus
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    depends_on:
      - redis
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis:6379
    networks:
      - garderobus

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: garderobus/api:latest
    environment:
      APP_PORT: ${APP_PORT:-8000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-garderobus}:${POSTGRES_PASSWORD:-garderobus}@db:5432/${POSTGRES_DB:-smart_closet}
      CLOTHES_IMAGE_DIR: ${CLOTHES_IMAGE_DIR:-clothes_images}
      MANNEQUIN_IMAGE_DIR: ${MANNEQUIN_IMAGE_DIR:-mannequins}
      CACHE_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: /var/log/garderobus/api.log
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      JAEGER_AGENT_HOST: jaeger
      API_RATE_LIMIT: ${API_RATE_LIMIT:-240/minute}
      HTTP_CLIENT_TIMEOUT: ${HTTP_CLIENT_TIMEOUT:-5.0}
      HTTP_CLIENT_RATE_LIMIT: ${HTTP_CLIENT_RATE_LIMIT:-120}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - api_logs:/var/log/garderobus
    networks:
      - garderobus
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:${APP_PORT:-8000}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.25
    depends_on:
      - api
    ports:
      - "${API_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - garderobus

  nginx-exporter:
    image: nginxinc/nginx-prometheus-exporter:0.11.0
    depends_on:
      - nginx
    ports:
      - "9113:9113"
    command:
      - -nginx.scrape-uri=http://nginx/nginx_status
    networks:
      - garderobus

  prometheus:
    image: prom/prometheus:v2.51.1
    depends_on:
      - api
      - cadvisor
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - garderobus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    depends_on:
      - prometheus
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    networks:
      - garderobus

  grafana:
    image: grafana/grafana:10.4.3
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - garderobus

  jaeger:
    image: jaegertracing/all-in-one:1.54
    ports:
      - "16686:16686"
      - "6831:6831/udp"
    networks:
      - garderobus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - garderobus

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - garderobus

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    user: root
    depends_on:
      - elasticsearch
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - api_logs:/var/log/garderobus:ro
      - filebeat_data:/usr/share/filebeat/data
    networks:
      - garderobus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - garderobus

networks:
  garderobus:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  api_logs:
  es_data:
  filebeat_data:
